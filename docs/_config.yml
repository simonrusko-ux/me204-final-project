# GitHub Pages build settings for the public page in docs/.
#
# Primer is kept only so that `@import "{{ site.theme }}"` in
# assets/css/style.scss still resolves. Its layout is overridden by
# _layouts/default.html, because the theme layout printed the repository name as
# a full-size heading above every page. Everything the reader sees comes from
# that layout and from the stylesheet, which matches the palette and typography
# of the charts exported by NB03.

theme: jekyll-theme-primer

title: "S&P 500 vs. Savings Account"
description: >-
  A ten-year comparison of the S&P 500 against a US savings account,
  built from FRED data. ME204 final project.

# The markdown files carry no front matter, so the layout has to be applied here.
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
