<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- The theme's own layout printed the repository name as a full-size heading
       above the content, which competed with the article title. This masthead
       replaces it: same information, set small in the corner where a publication
       puts its own name. -->
  <header class="masthead">
    <a href="{{ '/' | relative_url }}">ME204 &middot; Final project</a>
  </header>

  <main class="markdown-body">
    {{ content }}
  </main>

  <!-- Lights the figures in the text as they scroll into view. Two ways in: a
       bold run that is a number is picked up automatically, and anything wrapped
       in <mark> is picked up whatever it says - which lets a phrase carry the
       stroke without also turning bold. -->
  <script>
  (function () {
    // A run of digits, optionally signed, with a currency sign or a percent sign.
    var isFigure = function (text) {
      return /^[-+\u2212]?[$£€]?\d[\d.,]*\s*%?$/.test(text.trim());
    };

    var marks = [];
    document.querySelectorAll('.markdown-body strong').forEach(function (el) {
      var p = el.parentElement;
      // Skip the standing question, which is a whole paragraph set in bold.
      if (p.tagName === 'P' && p.textContent.trim() === el.textContent.trim()) return;
      if (!isFigure(el.textContent)) return;
      el.classList.add('figure');
      marks.push(el);
    });

    document.querySelectorAll('.markdown-body mark').forEach(function (el) {
      el.classList.add('figure');
      marks.push(el);
    });

    // Without IntersectionObserver, show the highlights rather than nothing.
    if (!('IntersectionObserver' in window)) {
      marks.forEach(function (el) { el.classList.add('is-lit'); });
      return;
    }

    var seen = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        // Toggled, not added once: scrolling back up unpaints the stroke the
        // same way it was painted.
        entry.target.classList.toggle('is-lit', entry.isIntersecting);
      });
    }, { rootMargin: '0px 0px -20% 0px', threshold: 0.9 });

    marks.forEach(function (el) { seen.observe(el); });
  }());
  </script>

</body>
</html>
